services:
    php-fpm:
        build:
            context: ./.docker/php-fpm
            args:
                PHP_VERSION: ${COMPOSE_PHP_VERSION:-8.4}
                USER_ID: ${COMPOSE_USER_ID:-1000}
                GROUP_ID: ${COMPOSE_GROUP_ID:-1000}
        restart: unless-stopped
        extra_hosts:
            - "tile-expert-test.local:host-gateway"
        volumes:
            - ./:/var/www/html:rw
        networks:
            - tile-expert-test-app
            - shared-smtp

    nginx:
        build: ./.docker/nginx
        restart: unless-stopped
        volumes_from:
            - php-fpm
        networks:
            reverse-proxy:
            tile-expert-test-app:
                aliases:
                    - tile-expert-test.local
                    - localhost
        expose:
            - "80"
        environment:
            - VIRTUAL_PORT=80
            - VIRTUAL_HOST=localhost
            - HTTPS_METHOD=redirect
            - SELF_SIGNED_HOST=localhost
        depends_on:
            - php-fpm

    mysql:
        build: ./.docker/mysql
        restart: unless-stopped
        environment:
            - MYSQL_USER=user
            - MYSQL_PASSWORD=password
            - MYSQL_DATABASE=tile_expert_test_backend
            - MYSQL_ROOT_PASSWORD=password
            - MYSQL_ALLOW_EMPTY_PASSWORD=true
        volumes:
            - ./.docker/mysql/data:/var/lib/mysql
        networks:
            - tile-expert-test-app

    adminer:
        image: adminer
        restart: unless-stopped
        networks:
            - reverse-proxy
            - tile-expert-test-app
        expose:
            - "8080"
        environment:
            - VIRTUAL_PORT=8080
            - VIRTUAL_HOST=adminer.localhost
            - HTTPS_METHOD=redirect
            - SELF_SIGNED_HOST=localhost

networks:
    reverse-proxy:
        name: reverse-proxy
        external: true
    shared-smtp:
        name: shared-smtp
        external: true
    tile-expert-test-app:
        driver: bridge
