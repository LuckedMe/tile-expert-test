services:
    php-fpm:
        build:
            context: ./.docker/php-fpm
            args:
                PHP_VERSION: ${COMPOSE_PHP_VERSION:-8.4}
                USER_ID: ${COMPOSE_USER_ID:-1000}
                GROUP_ID: ${COMPOSE_GROUP_ID:-1000}
        restart: unless-stopped
        extra_hosts:
            - "tile-expert-test.local:host-gateway"
        volumes:
            - ./:/var/www/html:rw
        networks:
            - tile-expert-test-app

    nginx:
        build: ./.docker/nginx
        restart: unless-stopped
        volumes_from:
            - php-fpm
        networks:
            tile-expert-test-app:
                aliases:
                    - tile-expert-test.local
                    - localhost
        ports:
            - "${NGINX_PORT:-8080}:80"
        depends_on:
            - php-fpm

    mysql:
        build: ./.docker/mysql
        restart: unless-stopped
        environment:
            - MYSQL_USER=user
            - MYSQL_PASSWORD=password
            - MYSQL_DATABASE=tile_expert_test_backend
            - MYSQL_ROOT_PASSWORD=password
            - MYSQL_ALLOW_EMPTY_PASSWORD=true
        volumes:
            - ./.docker/mysql/data:/var/lib/mysql
        networks:
            - tile-expert-test-app
        ports:
            - "${MYSQL_PORT:-3306}:3306"

    manticore:
        image: manticoresearch/manticore:${MANTICORE_VERSION:-32.1.3}
        restart: unless-stopped
        volumes:
            - manticore-data:/var/lib/manticore
        networks:
            - tile-expert-test-app
        ports:
            - "${MANTICORE_PORT:-9308}:9308"
        ulimits:
            nproc: 65535
            nofile:
                soft: 65535
                hard: 65535
            memlock:
                soft: -1
                hard: -1

    adminer:
        image: adminer
        restart: unless-stopped
        networks:
            - tile-expert-test-app
        ports:
            - "${ADMINER_PORT:-8081}:8080"

volumes:
    manticore-data:

networks:
    tile-expert-test-app:
        driver: bridge
